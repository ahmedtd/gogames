syntax = "proto3";

option go_package = "shellworld/americana/resource/resourcepb";

message Resource {
    oneof {
        ImageStampResource = 1;
    }
}

message ImageStampResource {
    string image_path = 1;
    vec2 pixel_center = 2;
    vec2 natural_facing = 3;
    float64 natural_world_width = 4;
    float64 natural_world_height = 5;
}

message Vec2 {
    float64 e0 = 1;
    float64 e1 = 2;
}